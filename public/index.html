<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radio Net Trainer</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<main id="join-screen" class="screen">
  <form id="join-form">
    <h1>Radio Net Trainer</h1>
    <label>
      Session Code
      <input type="text" id="join-code" value="NET1" maxlength="20" autocomplete="off" />
    </label>
    <fieldset>
      <legend>Role</legend>
      <label class="radio">
        <input type="radio" name="role" value="participant" checked /> Participant
      </label>
      <label class="radio">
        <input type="radio" name="role" value="instructor" /> Instructor
      </label>
    </fieldset>
    <label id="passcode-field" hidden>
      Instructor Passcode
      <input type="password" id="join-passcode" autocomplete="off" />
    </label>
    <p id="join-error" class="error" hidden></p>
    <button type="submit">Join Net</button>
  </form>
</main>

<main id="net-screen" class="screen" hidden>
  <header class="net-header">
    <div class="net-title">Radio Net <span id="header-session-code"></span></div>
    <div id="roster" class="roster"></div>
  </header>

  <section id="radio-display" class="radio-display" aria-live="polite">
    <div id="radio-status" class="radio-status">Channel idle</div>
    <div class="speech-controls">
      <label class="speech-toggle">
        <input type="checkbox" id="speech-toggle" checked />
        Speak words aloud
      </label>
      <label class="speech-rate">
        Voice speed
        <input type="range" id="speech-rate" min="0.5" max="3" step="0.1" value="1" />
      </label>
    </div>
    <p id="speech-fallback" class="speech-fallback" hidden>
      Speech isn't working in this browser — showing the words on screen instead.
    </p>
    <details id="text-fold" class="text-fold">
      <summary>Show words on screen</summary>
      <div id="radio-text" class="radio-text"></div>
    </details>
  </section>

  <form id="send-form" class="send-form">
    <input type="text" id="send-text" placeholder="Type your transmission, starting with your call sign or name..." maxlength="500" autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <section id="instructor-panel" class="instructor-panel" hidden>
    <div class="instructor-controls">
      <label>
        WPM
        <input type="range" id="wpm-slider" min="20" max="300" value="100" />
        <span id="wpm-value">100</span>
      </label>
    </div>
    <h2>Transcript</h2>
    <table id="log-table">
      <thead>
        <tr><th>Time</th><th>From</th><th>Message</th><th>Status</th></tr>
      </thead>
      <tbody id="log-body"></tbody>
    </table>
  </section>
</main>

<script src="collisionEffect.js"></script>
<script src="client.js"></script>
</body>
</html>
